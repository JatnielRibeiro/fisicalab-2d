:root{--teal:#0d9488;--dark:#0f766e;--ink:#18243a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f8fafc;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:600 16px Nunito,Arial,sans-serif}.site-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px max(18px,calc((100vw - 1000px)/2));background:#fff;border-bottom:1px solid #e5e7eb}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:700 25px Fredoka;color:#18181b}.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:23px;box-shadow:0 4px 0 var(--dark)}.brand em{font-style:normal;color:var(--teal)}.back{color:var(--dark);font-weight:900;text-decoration:none}.wrap{width:min(900px,calc(100% - 28px));margin:25px auto 50px}.hero{padding:26px 28px;border:3px solid #17345d;border-radius:22px;background:linear-gradient(125deg,#0f766e,#0d9488 60%,#164e63);color:#fff;box-shadow:0 7px 0 #17345d20}.eyebrow{font-size:11px;font-weight:1000;letter-spacing:.13em;color:#ccfbf1;text-transform:uppercase}.hero h1{font:700 clamp(30px,5vw,44px)/1.1 Fredoka;margin:9px 0}.hero p{margin:0;color:#e3fffa;line-height:1.6}.content{margin-top:18px;padding:22px;background:#fff;border:2px solid #d6e0e8;border-radius:18px;box-shadow:0 6px 18px #0f172a0c}.content h2{font:700 24px Fredoka;color:#18243a;margin:22px 0 8px}.content h2:first-child{margin-top:0}.concept{padding:15px;border-left:4px solid var(--teal);border-radius:9px;background:#f0fdfa;color:#244b50;font-weight:800;line-height:1.6}.formula{display:block;margin-top:7px;color:var(--dark);font:700 22px Fredoka}.explanation{color:#42566f;line-height:1.7}.extra{margin-top:18px;padding:17px;border:1.5px dashed #99c7c2;border-radius:13px;background:#f8fffe}.extra h4{margin:0 0 7px;color:var(--dark);font:700 19px Fredoka}.extra p{color:#42566f;line-height:1.65}.challenge{margin-top:20px;padding-top:15px;border-top:1px solid #cde4df}.challenge h3{font:700 19px Fredoka;color:var(--dark)}.answer-btn,.pyth-reset,.sim-actions button{border:2px solid var(--dark);border-radius:12px;padding:10px 15px;background:var(--teal);color:#fff;font:900 14px Nunito;cursor:pointer}.answer{display:none;margin-top:10px;padding:12px;background:#e0f2fe;border-radius:9px;color:#164e63}.answer.show{display:block}.function-simulator{margin:16px 0;padding:16px;background:#fff;border:2px solid #cbd5e1;border-radius:16px}.function-simulator h2{margin:0 0 6px}.sim-intro{color:#64748b;line-height:1.5}.sim-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sim-field label{display:block;font-weight:900}.sim-field input,.pyth-fields input{width:100%;padding:10px;border:2px solid #cbd5e1;border-radius:10px;font:800 16px Nunito}.sim-hint{display:block;color:#64748b;font-size:12px}.sim-equation,.pyth-equation{padding:10px;background:#f0fdfa;color:#0f766e;font:700 20px Fredoka}.sim-graph,.pyth-diagram{background:#fff;border:1px solid #dbe4ec;border-radius:12px;overflow:hidden}.sim-graph svg,.pyth-diagram svg{display:block;width:100%;height:auto}.sim-status,.pyth-result{color:#0f766e;font-weight:900}.sim-actions{display:flex;justify-content:flex-end;margin-top:10px}.pythagoras-simulator{margin:16px 0;padding:15px;border:1.5px solid #99c7c2;border-radius:13px;background:#f8fffe}.pythagoras-simulator h4{font:700 19px Fredoka;color:#0f766e}.pyth-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pyth-fields label{font-size:13px;font-weight:900}.pyth-diagram{max-width:360px;margin:12px auto}.pyth-reset{background:#fff;color:#0f766e}.not-found{padding:30px;background:white;border-radius:16px}footer{text-align:center;color:#64748b;padding:25px;font-size:12px}

<script>
const topics=[{"slug":"funcao-afim","title":"Função Afim","description":"Uma relação entre duas variáveis em que a taxa de variação é constante.","concept":"A função afim associa cada valor de x a um único valor de y.<span class=\"formula\">f(x) = ax + b</span>","extra":"<h4>Como interpretar?</h4><p><strong>a</strong> indica a inclinação da reta e a taxa de variação. <strong>b</strong> indica onde a reta cruza o eixo y. Exemplo: f(x)=2x+3 cresce 2 unidades em y a cada aumento de 1 em x.</p><section class=\"function-simulator\" aria-labelledby=\"sim-title\">\n<h2 id=\"sim-title\">Simulador de Função Afim</h2>\n<p class=\"sim-intro\">Altere os coeficientes e observe como a reta muda. Os dois valores são opcionais: se deixar um campo vazio, o simulador considera o valor padrão indicado.</p>\n<div class=\"sim-controls\">\n<div class=\"sim-field\"><label for=\"coef-a\">Coeficiente angular (a)</label><input id=\"coef-a\" type=\"number\" step=\"any\" inputmode=\"decimal\" placeholder=\"Padrão: 1\"><span class=\"sim-hint\">Define a inclinação e o sentido da reta.</span></div>\n<div class=\"sim-field\"><label for=\"coef-b\">Coeficiente linear (b)</label><input id=\"coef-b\" type=\"number\" step=\"any\" inputmode=\"decimal\" placeholder=\"Padrão: 0\"><span class=\"sim-hint\">Define onde a reta cruza o eixo y.</span></div>\n</div>\n<div class=\"sim-equation\" id=\"sim-equation\" aria-live=\"polite\">f(x) = x</div>\n<div class=\"sim-graph\"><svg id=\"affine-graph\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"Gráfico cartesiano interativo de uma função afim\"><defs><clipPath id=\"plot-clip\"><rect x=\"48\" y=\"18\" width=\"560\" height=\"280\"/></clipPath></defs><rect x=\"48\" y=\"18\" width=\"560\" height=\"280\" rx=\"8\" fill=\"#fff\"/><g id=\"graph-grid\"></g><g id=\"graph-axes\"></g><g clip-path=\"url(#plot-clip)\"><path id=\"graph-line\" d=\"\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"4\" stroke-linecap=\"round\"/></g><g id=\"graph-labels\" fill=\"#64748b\" font-family=\"Nunito,Arial\" font-size=\"11\"></g></svg></div>\n<p class=\"sim-status\" id=\"sim-status\">Quando x aumenta 1 unidade, y aumenta 1 unidade.</p>\n<div class=\"sim-actions\"><button id=\"sim-reset\" type=\"button\">Restaurar valores padrão</button></div>\n</section>","question":"Na função f(x)=3x+2, quanto vale f(4)?","answer":"f(4)=3·4+2=14.","icon":"📈","category":"MATEMÁTICA · ÁLGEBRA"},{"slug":"teorema-de-pitagoras","title":"Teorema de Pitágoras","description":"Uma relação entre os lados de qualquer triângulo retângulo.","concept":"O quadrado da hipotenusa é igual à soma dos quadrados dos catetos.<span class=\"formula\">a² + b² = c²</span>","extra":"<h4>Exemplo visual</h4><p>Se os catetos medem 3 e 4, então a hipotenusa mede 5, pois 3²+4²=9+16=25.</p><section class=\"pythagoras-simulator\" aria-labelledby=\"pyth-title\">\n<h4 id=\"pyth-title\">Simulador do Teorema de Pitágoras</h4>\n<p>Informe dois lados para descobrir o terceiro. Você pode calcular a hipotenusa ou um dos catetos.</p>\n<div class=\"pyth-fields\">\n<label>Cateto a <input id=\"pyth-a\" type=\"number\" min=\"0.01\" step=\"any\" placeholder=\"Ex.: 3\"></label>\n<label>Cateto b <input id=\"pyth-b\" type=\"number\" min=\"0.01\" step=\"any\" placeholder=\"Ex.: 4\"></label>\n<label>Hipotenusa c <input id=\"pyth-c\" type=\"number\" min=\"0.01\" step=\"any\" placeholder=\"Ex.: 5\"></label>\n</div>\n<div class=\"pyth-equation\" id=\"pyth-equation\">a² + b² = c²</div>\n<div class=\"pyth-diagram\"><svg viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"Triângulo retângulo com os catetos a e b e a hipotenusa c\"><path d=\"M55 185 L55 35 L300 185 Z\" fill=\"#ccfbf1\" fill-opacity=\".55\" stroke=\"#0f766e\" stroke-width=\"3\"/><path d=\"M55 165 L75 165 L75 185\" fill=\"none\" stroke=\"#334155\" stroke-width=\"2\"/><text x=\"35\" y=\"112\" id=\"pyth-label-a\" fill=\"#0f766e\" font-size=\"15\" font-weight=\"bold\">a</text><text x=\"175\" y=\"208\" id=\"pyth-label-b\" fill=\"#0f766e\" font-size=\"15\" font-weight=\"bold\">b</text><text x=\"190\" y=\"94\" id=\"pyth-label-c\" fill=\"#0f766e\" font-size=\"15\" font-weight=\"bold\">c</text></svg></div>\n<p class=\"pyth-result\" id=\"pyth-result\" aria-live=\"polite\">Preencha exatamente dois lados para calcular o terceiro.</p>\n<button class=\"pyth-reset\" id=\"pyth-reset\" type=\"button\">Limpar valores</button>\n</section>","question":"Catetos 5 e 12. Qual é a hipotenusa?","answer":"13 unidades, pois √(5²+12²)=√169=13.","icon":"📐","category":"MATEMÁTICA · GEOMETRIA"},{"slug":"movimento-uniforme-mru","title":"Movimento Uniforme (MRU)","description":"Movimento em trajetória retilínea com velocidade constante.","concept":"Em intervalos de tempo iguais, o móvel percorre deslocamentos iguais.<span class=\"formula\">s = s₀ + v · t</span>","extra":"<h4>Exemplo aplicado</h4><p>Um carro parte da posição 10 m e mantém 5 m/s. Após 4 s, estará em s=10+5·4=30 m.</p>","question":"Um móvel percorre 60 m em 5 s com velocidade constante. Qual é sua velocidade?","answer":"v=Δs/Δt=60/5=12 m/s.","icon":"🚗","category":"FÍSICA · CINEMÁTICA"},{"slug":"segunda-lei-de-newton","title":"Segunda Lei de Newton","description":"A força resultante está relacionada à massa e à aceleração do corpo.","concept":"A aceleração tem a direção e o sentido da força resultante.<span class=\"formula\">Fᵣ = m · a</span>","extra":"<h4>Exemplo aplicado</h4><p>Uma força resultante de 20 N atua em um corpo de 4 kg. A aceleração é a=20/4=5 m/s².</p>","question":"Qual força resultante produz 3 m/s² em uma massa de 2 kg?","answer":"Fᵣ=2·3=6 N.","icon":"🧱","category":"FÍSICA · DINÂMICA"},{"slug":"fotossintese","title":"Fotossíntese","description":"Processo pelo qual plantas, algas e algumas bactérias convertem energia luminosa em energia química.","concept":"A energia da luz permite produzir moléculas orgânicas a partir de água e dióxido de carbono.","extra":"<h4>O que acontece?</h4><p>Na fotossíntese oxigênica, a luz participa das reações que permitem formar compostos orgânicos; o processo libera oxigênio a partir da água. A clorofila é um pigmento importante na captação da luz.</p>","question":"Quais são dois materiais necessários para a fotossíntese?","answer":"Água (H₂O) e dióxido de carbono (CO₂), com energia luminosa.","icon":"🌱","category":"CIÊNCIAS · BIOLOGIA"},{"slug":"ciclo-da-agua","title":"Ciclo da Água","description":"Circulação contínua da água entre superfície terrestre, oceanos e atmosfera.","concept":"A água muda de estado físico e se desloca pelo ambiente em diferentes etapas.","extra":"<h4>Etapas importantes</h4><p>Evaporação: líquido para vapor. Condensação: vapor forma gotículas. Precipitação: água retorna à superfície. Infiltração e escoamento redistribuem a água no solo e nos corpos d'água.</p>","question":"Como se chama a passagem do vapor de água para gotículas líquidas?","answer":"Condensação.","icon":"💧","category":"CIÊNCIAS · AMBIENTE"},{"slug":"equacao-do-2-grau","title":"Equação do 2º Grau","description":"Equações polinomiais com maior expoente igual a dois.","concept":"Forma geral:<span class=\"formula\">ax² + bx + c = 0</span>","extra":"<h4>Discriminante</h4><p>Δ=b²−4ac. Se Δ for positivo, há duas raízes reais distintas; se zero, uma raiz real dupla; se negativo, não há raízes reais.</p>","question":"Na equação x²−5x+6=0, quais são as raízes?","answer":"x=2 e x=3.","icon":"🧮","category":"MATEMÁTICA · ÁLGEBRA"},{"slug":"plano-cartesiano","title":"Plano Cartesiano","description":"Sistema de referência para localizar pontos por coordenadas.","concept":"Cada ponto é representado por um par ordenado (x,y).","extra":"<h4>Leitura das coordenadas</h4><p>O primeiro número indica a posição no eixo x; o segundo, no eixo y. O ponto (−2,3) fica duas unidades à esquerda e três acima da origem.</p>","question":"Em qual quadrante está (4,−2)?","answer":"No quarto quadrante: x positivo e y negativo.","icon":"📍","category":"MATEMÁTICA · GEOMETRIA"},{"slug":"movimento-uniformemente-variado","title":"Movimento Uniformemente Variado","description":"Movimento em que a aceleração escalar permanece constante.","concept":"A velocidade varia igualmente em intervalos de tempo iguais.<span class=\"formula\">v = v₀ + a · t</span>","extra":"<h4>Exemplo aplicado</h4><p>Com v₀=4 m/s, a=2 m/s² e t=3 s, a velocidade final é 10 m/s.</p>","question":"Com v₀=5 m/s, a=3 m/s² e t=2 s, qual é v?","answer":"v=11 m/s.","icon":"🏎️","category":"FÍSICA · CINEMÁTICA"},{"slug":"energia-cinetica","title":"Energia Cinética","description":"Energia associada ao movimento de um corpo.","concept":"Depende da massa e do quadrado da velocidade.<span class=\"formula\">E꜀ = m · v² / 2</span>","extra":"<h4>Relação com a velocidade</h4><p>Dobrar a velocidade quadruplica a energia cinética, mantendo a massa constante.</p>","question":"Qual é a energia cinética de um corpo de 2 kg a 3 m/s?","answer":"E꜀=9 J.","icon":"⚡","category":"FÍSICA · ENERGIA"},{"slug":"sistema-solar","title":"Sistema Solar","description":"O Sol e os corpos celestes ligados gravitacionalmente a ele.","concept":"Oito planetas orbitam o Sol, além de luas, planetas anões, asteroides e cometas.","extra":"<h4>Organização</h4><p>Mercúrio, Vênus, Terra e Marte são rochosos; Júpiter, Saturno, Urano e Netuno são gigantes.</p>","question":"Qual é o maior planeta do Sistema Solar?","answer":"Júpiter.","icon":"🪐","category":"CIÊNCIAS · ASTRONOMIA"},{"slug":"sistema-circulatorio","title":"Sistema Circulatório","description":"Conjunto de estruturas que transporta sangue pelo organismo.","concept":"Coração, sangue e vasos sanguíneos atuam em conjunto no transporte de substâncias.","extra":"<h4>Funções principais</h4><p>Participa do transporte de oxigênio, nutrientes, hormônios e resíduos metabólicos.</p>","question":"Qual órgão impulsiona o sangue?","answer":"O coração.","icon":"❤️","category":"CIÊNCIAS · BIOLOGIA"}];
const params=new URLSearchParams(location.search);const slug=params.get('tema');const item=topics.find(t=>t.slug===slug);const page=document.getElementById('page');
if(!item){page.innerHTML='<div class="not-found"><h1>Assunto não encontrado</h1><p>Volte às Fichas Visuais e escolha outro tema.</p><a href="fichas-visuais.html">Voltar às fichas</a></div>';}
else{
 document.title=item.title+' | UniversoLab';
 page.innerHTML='<section class="hero"><span class="eyebrow">UniversoLab · '+item.category+'</span><h1>'+item.icon+' '+item.title+'</h1><p>'+item.description+'</p></section><article class="content"><h2>Ideia central</h2><div class="concept">'+item.concept+'</div><h2>Entenda o conceito</h2><div class="explanation">'+item.extra+'</div><section class="challenge"><h3>Desafio para testar sua compreensão</h3><p>'+item.question+'</p><button class="answer-btn" id="show-answer">Revelar resposta</button><div class="answer" id="answer">'+item.answer+'</div></section></article>';
 const btn=document.getElementById('show-answer');btn.addEventListener('click',()=>{const ans=document.getElementById('answer');const show=ans.classList.toggle('show');btn.textContent=show?'Ocultar resposta':'Revelar resposta'});
}
function fmt(v){return Number(v.toFixed(3)).toString().replace('.',',')}
const inputA=document.getElementById('coef-a'),inputB=document.getElementById('coef-b');
if(inputA&&inputB){
 const equation=document.getElementById('sim-equation'),status=document.getElementById('sim-status'),grid=document.getElementById('graph-grid'),axes=document.getElementById('graph-axes'),labels=document.getElementById('graph-labels'),line=document.getElementById('graph-line');
 const p={left:48,top:18,width:560,height:280,xmin:-5,xmax:5,ymin:-5,ymax:5};const px=x=>p.left+(x-p.xmin)/(p.xmax-p.xmin)*p.width;const py=y=>p.top+(p.ymax-y)/(p.ymax-p.ymin)*p.height;
 function draw(){const a=inputA.value.trim()===''?1:Number(inputA.value),b=inputB.value.trim()===''?0:Number(inputB.value);if(!Number.isFinite(a)||!Number.isFinite(b)){status.textContent='Informe coeficientes válidos.';return}let g='',l='';for(let v=-5;v<=5;v++){const x=px(v),y=py(v);g+='<line x1="'+x+'" y1="'+p.top+'" x2="'+x+'" y2="'+(p.top+p.height)+'" stroke="#e5edf2"/><line x1="'+p.left+'" y1="'+y+'" x2="'+(p.left+p.width)+'" y2="'+y+'" stroke="#e5edf2"/>';if(v!==0)l+='<text x="'+x+'" y="315" text-anchor="middle">'+v+'</text><text x="37" y="'+(y+4)+'" text-anchor="end">'+v+'</text>'}grid.innerHTML=g;axes.innerHTML='<line x1="'+p.left+'" y1="'+py(0)+'" x2="'+(p.left+p.width)+'" y2="'+py(0)+'" stroke="#334155" stroke-width="2"/><line x1="'+px(0)+'" y1="'+p.top+'" x2="'+px(0)+'" y2="'+(p.top+p.height)+'" stroke="#334155" stroke-width="2"/>';labels.innerHTML=l+'<text x="616" y="'+(py(0)-9)+'">x</text><text x="'+(px(0)+9)+'" y="15">y</text>';line.setAttribute('d','M '+px(-5)+' '+py(-5*a+b)+' L '+px(5)+' '+py(5*a+b));equation.textContent='f(x) = '+(a===1?'':a===-1?'−':fmt(a)+' · ')+'x'+(b>0?' + '+fmt(b):b<0?' − '+fmt(-b):'');status.textContent=(a>0?'Função crescente.':a<0?'Função decrescente.':'Função constante.')+' Inclinação a = '+fmt(a)+'.'}[inputA,inputB].forEach(el=>el.addEventListener('input',draw));document.getElementById('sim-reset').addEventListener('click',()=>{inputA.value='';inputB.value='';draw()});draw();
}
const pythIds=['pyth-a','pyth-b','pyth-c'];const pythInputs=pythIds.map(id=>document.getElementById(id));
if(pythInputs.every(Boolean)){
 const result=document.getElementById('pyth-result');function pf(n){return Number(n.toFixed(4)).toString().replace('.',',')}
 function update(){const v=pythInputs.map(el=>el.value.trim()===''?null:Number(el.value));const filled=v.filter(x=>x!==null).length;['pyth-label-a','pyth-label-b','pyth-label-c'].forEach((id,i)=>document.getElementById(id).textContent=v[i]===null?['a','b','c'][i]:['a = ','b = ','c = '][i]+pf(v[i]));if(v.some(x=>x!==null&&(!Number.isFinite(x)||x<=0))){result.textContent='Use valores positivos e válidos.';return}if(filled!==2){result.textContent=filled<2?'Preencha exatamente dois lados.':'Deixe em branco o lado que deseja descobrir.';return}let text='';if(v[0]!==null&&v[1]!==null){const c=Math.hypot(v[0],v[1]);pythInputs[2].value=pf(c);text='Hipotenusa c = √('+pf(v[0])+'² + '+pf(v[1])+'²) = '+pf(c)+'.'}else if(v[2]!==null&&v[0]!==null){if(v[2]<=v[0]){result.textContent='A hipotenusa deve ser maior que o cateto.';return}const b=Math.sqrt(v[2]*v[2]-v[0]*v[0]);pythInputs[1].value=pf(b);text='Cateto b = √('+pf(v[2])+'² − '+pf(v[0])+'²) = '+pf(b)+'.'}else{if(v[2]<=v[1]){result.textContent='A hipotenusa deve ser maior que o cateto.';return}const a=Math.sqrt(v[2]*v[2]-v[1]*v[1]);pythInputs[0].value=pf(a);text='Cateto a = √('+pf(v[2])+'² − '+pf(v[1])+'²) = '+pf(a)+'.'}result.textContent=text}
 pythInputs.forEach(el=>el.addEventListener('input',()=>{if(pythInputs.filter(x=>x.value.trim()!=='').length===3){const active=pythInputs.indexOf(el);pythInputs.forEach((x,i)=>{if(i!==active)x.value=''})}update()}));document.getElementById('pyth-reset').addEventListener('click',()=>{pythInputs.forEach(x=>x.value='');update()});update();
}
</script></body></html>
