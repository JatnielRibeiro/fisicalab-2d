const experiments=[{"slug":"movimento-retilineo-uniforme","title":"Movimento Retilíneo Uniforme (MRU)","category":"CINEMÁTICA","icon":"🚗","summary":"Investigue o movimento em linha reta com velocidade constante.","question":"Como a posição de um móvel muda quando ele percorre distâncias iguais em intervalos de tempo iguais?","concept":"No MRU, a velocidade permanece constante e a aceleração é nula. A posição varia linearmente com o tempo.","formula":"s = s₀ + v · t","steps":["Marque uma posição inicial para o móvel.","Registre a posição em intervalos de tempo iguais.","Compare os deslocamentos em cada intervalo.","Construa uma tabela de posição em função do tempo e interprete o gráfico."],"analysis":"Se os deslocamentos em intervalos iguais de tempo forem iguais, o movimento é compatível com velocidade constante. No gráfico posição × tempo, a inclinação representa a velocidade.","video":""},{"slug":"movimento-retilineo-uniformemente-variado","title":"Movimento Retilíneo Uniformemente Variado (MRUV)","category":"CINEMÁTICA","icon":"🏎️","summary":"Observe como a velocidade muda quando a aceleração é constante.","question":"O que acontece com a velocidade de um móvel quando uma aceleração constante atua durante o movimento?","concept":"No MRUV, a aceleração é constante e a velocidade varia uniformemente com o tempo.","formula":"v = v₀ + a · t   |   s = s₀ + v₀t + ½at²","steps":["Escolha uma rampa e um objeto que possa rolar com segurança.","Marque posições ao longo do percurso.","Registre os instantes em que o objeto passa por cada posição.","Compare os intervalos de velocidade e estime a aceleração."],"analysis":"No MRUV, o gráfico velocidade × tempo é uma reta cuja inclinação representa a aceleração. O gráfico posição × tempo tem formato parabólico.","video":""},{"slug":"lancamento-obliquo","title":"Lançamento Oblíquo","category":"CINEMÁTICA","icon":"🏀","summary":"Decomponha o movimento de um projétil em direções horizontal e vertical.","question":"Como o ângulo de lançamento influencia a trajetória e o alcance de um projétil?","concept":"Desprezando a resistência do ar, o lançamento oblíquo combina movimento horizontal uniforme e movimento vertical uniformemente variado sob a ação da gravidade.","formula":"x = v₀ cos(θ) · t   |   y = y₀ + v₀ sen(θ)t − ½gt²","steps":["Defina a velocidade inicial e o ângulo de lançamento.","Observe a trajetória em diferentes ângulos.","Registre o tempo de voo e o alcance horizontal.","Compare as componentes horizontal e vertical da velocidade."],"analysis":"A trajetória ideal é parabólica. A componente horizontal da velocidade permanece constante, enquanto a componente vertical varia devido à aceleração gravitacional.","video":""}];const slug=new URLSearchParams(location.search).get('tema');const item=experiments.find(x=>x.slug===slug);const page=document.getElementById('page');
if(!item){page.innerHTML='<section class="section"><h2>Experimento não encontrado</h2><a href="experimentos.html">Voltar aos experimentos</a></section>'}
else{document.title=item.title+' | UniversoLab';const video=item.video?'<iframe class="video-frame" src="'+item.video+'" title="Vídeo do experimento '+item.title+'" allowfullscreen loading="lazy"></iframe>':'<div class="video-placeholder"><div><span>▶️</span><strong>Vídeo e aula experimental</strong><p>Espaço reservado para incorporar o vídeo demonstrativo e a aula explicativa deste experimento.</p></div></div>';page.innerHTML='<section class="hero"><span class="kicker">UNIVERSOLAB · FÍSICA · '+item.category+'</span><h1>'+item.icon+' '+item.title+'</h1><p>'+item.summary+'</p></section><section class="section"><h2>Vídeo e aula experimental</h2>'+video+'<p class="note">Os vídeos serão adicionados a esta área. Quando houver um link de vídeo do YouTube, ele poderá ser incorporado aqui.</p></section><section class="section"><h2>Questão investigativa</h2><p>'+item.question+'</p></section><section class="section"><h2>Conceito físico</h2><p>'+item.concept+'</p><div class="formula">'+item.formula+'</div></section><section class="section"><h2>Roteiro de observação</h2><ol>'+item.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol></section><section class="section"><h2>Análise e interpretação</h2><p>'+item.analysis+'</p></section>'}
